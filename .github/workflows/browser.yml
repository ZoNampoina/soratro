name: Validate SORATRO in Chromium
on:
  push:
    branches: [main, work/v0.3, work/v0.4-traditional, work/v0.5-vocal]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chromium-validation-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 30
